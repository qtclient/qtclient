    optional GameclientMessageGetTransactionHistory gameclient_message_get_transaction_history = 254;
  }
}

// client opcode 0xFF (255) — GatherAll
// classic: bridge — classic side-channel until CIP field RE
message GameclientMessageGatherAll {
  extend GameclientMessage {
    optional GameclientMessageGatherAll gameclient_message_gather_all = 255;
  }
}

// client opcode 0x12C (300) — Unknown
// classic: bridge — classic side-channel until CIP field RE
message GameclientMessageUnknown {
  extend GameclientMessage {
    optional GameclientMessageUnknown gameclient_message_unknown = 300;
  }
}

