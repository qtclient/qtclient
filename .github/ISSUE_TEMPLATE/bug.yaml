---
name: Report a problem/bug
description: Issues found while using qtclient (desktop or WASM)
labels: ["Type: Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this issue!
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How critical is this?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Where is the problem?
      options:
        - label: Desktop client
        - label: Browser / WASM
        - label: Launcher
        - label: Packs / mods
        - label: Build / CI
        - label: Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and add screenshots, logs, or repro steps
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: What OS are you seeing the problem on?
      multiple: true
      options:
        - Linux
        - Windows
        - macOS
        - Browser (WASM)
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Contributing
      description: By submitting this issue, you agree to follow [AGENTS.md](https://github.com/qtclient/qtclient/blob/main/AGENTS.md)
      options:
        - label: I agree to follow this project's contributing guidelines
          required: true
