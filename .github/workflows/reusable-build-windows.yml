name: Reusable Windows Build

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile (CMake Release)
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Remove Windows pre-installed MySQL
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\mysql* -ErrorAction SilentlyContinue

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@v4.3.4
      - uses: oras-project/setup-oras@v1

      - name: Resolve CIP Qt SHA
        id: cip
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init third_party/Qt5LegacyControls
          SHA="$(git rev-parse HEAD:third_party/qt5-cip 2>/dev/null || true)"
          if [[ -z "$SHA" ]]; then
            git submodule update --init --depth 1 third_party/qt5-cip
            SHA="$(git -C third_party/qt5-cip rev-parse HEAD)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Restore CIP Qt prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: cip-qt-windows-x64-${{ steps.cip.outputs.sha }}

      - name: Install Qt (CIP)
        shell: bash
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/qt/ci-setup-qt.sh
          echo "QT_PREFIX=$(bash tools/qt/qt-prefix.sh)" >> "$GITHUB_ENV"

      - name: Configure and build tibia
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset windows-release \
            -DTOGGLE_BIN_FOLDER=ON \
            -DOPTIONS_ENABLE_IPO=OFF \
            -DTIBIA_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build --preset windows-release --target tibia

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-cmake-release
          path: build/windows-release/bin/
