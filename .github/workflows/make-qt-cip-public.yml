name: Make qt-cip public
on: workflow_dispatch
permissions:
  packages: write
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: List + set public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "== packages =="
          gh api "/orgs/qtclient/packages?package_type=container" --jq '.[].name' || true
          gh api "/user/packages?package_type=container" --jq '.[].name' || true
          # Try org package
          for path in \
            "/orgs/qtclient/packages/container/qt-cip" \
            "/users/humbertogontijo/packages/container/qt-cip"; do
            echo "== GET $path =="
            gh api "$path" --jq '{name,visibility,html_url,repository:.repository.full_name}' || true
            echo "== PATCH public $path =="
            gh api --method PATCH "$path" -f visibility=public && echo OK || echo FAIL
          done
