---
# Stock qtclient builds (MODS=OFF) + publish client / client-sdk artifacts keyed by SHA.
# idleot-client pack CI and idleot/release assemble consume these (no client rebuild).
name: 'Client: ci'

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: ci-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  sdk:
    name: sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Pack client-sdk
        env:
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_KIND: sdk
          PACKAGE_OUT: ${{ runner.temp }}/client-sdk
        run: bash scripts/lifecycle/package/sdk.sh
      - name: Upload client-sdk artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/client-sdk
          retention-days: 30
      - uses: oras-project/setup-oras@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Push client-sdk to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_KIND: sdk
          PACKAGE_OUT: ${{ runner.temp }}/client-sdk
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/lifecycle/publish/sdk.sh

  client-desktop:
    name: client-${{ matrix.plat }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            preset: linux-release
            os_slug: linux
            kit: linux-x64
            triplet: x64-linux-static
          - plat: macos-arm64
            runner: macos-15
            preset: macos-release
            os_slug: macos
            kit: macos-arm64
            triplet: arm64-osx-static
          - plat: windows-x64
            runner: windows-2022
            preset: windows-release
            os_slug: windows
            kit: windows-x64
            triplet: x64-windows-static-md
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: lukka/get-cmake@v4.3.4
      - uses: oras-project/setup-oras@v1

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve CIP Qt SHA
        id: cip
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=tools/qt/qt-version.sh
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore CIP Qt prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-${{ matrix.kit }}-${{ steps.cip.outputs.sha }}

      - name: qtclient bootstrap (deps + vcpkg + CIP Qt)
        shell: bash
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
          QT_PULL_INTERVAL_SECS: '90'
        run: bash tools/qt/ci-setup.sh --pull-only --with-vcpkg --with-deps

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # One warm slot per OS — always reuse / refresh (incl. fail/cancel).
          key: ccache-client-${{ matrix.os_slug }}
          restore-keys: |
            ccache-client-${{ matrix.os_slug }}
          save-always: true

      - name: Configure + build stock client
        id: build
        shell: bash
        env:
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/tools/zstd:$PATH"
          fi
          cmake --preset ${{ matrix.preset }} \
            -DTOGGLE_BIN_FOLDER=ON \
            -DOPTIONS_ENABLE_IPO=OFF \
            -DTIBIA_BUILD_TESTS=OFF \
            -DQTCLIENT_ENABLE_MODS=OFF \
            -DOPTIONS_ENABLE_CCACHE=ON \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build --preset ${{ matrix.preset }} --target tibia
          cmake --build --preset ${{ matrix.preset }} --target launcher || true
          ccache -s || true

      - name: Pack client desktop tip
        shell: bash
        env:
          QT_PREFIX: ${{ env.QT_PREFIX }}
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          PLATFORM: ${{ matrix.plat }}
          PACKAGE_OUT: ${{ runner.temp }}/client-${{ matrix.plat }}
        run: |
          set -euo pipefail
          bin_dir="build/${{ matrix.preset }}/bin"
          [[ -d "$bin_dir" ]] || bin_dir="build/${{ matrix.preset }}"
          BIN_DIR="$bin_dir" bash scripts/lifecycle/package/desktop.sh

      - name: Pack demo Release (myAAC + CipSoft assetsurl)
        shell: bash
        env:
          QT_PREFIX: ${{ env.QT_PREFIX }}
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          QTCLIENT_DEMO_RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: |
          set -euo pipefail
          bin_dir="build/${{ matrix.preset }}/bin"
          [[ -d "$bin_dir" ]] || bin_dir="build/${{ matrix.preset }}"
          # Launcher target may be optional — skip demo if missing.
          if [[ ! -x "$bin_dir/launcher" && ! -x "$bin_dir/launcher.exe" && ! -d "$bin_dir/launcher.app" ]]; then
            echo "[demo] launcher binary missing — skip demo pack"
            exit 0
          fi
          bash scripts/lifecycle/package/demo.sh \
            --platform "${{ matrix.plat }}" \
            --bin "$bin_dir" \
            --out "$RUNNER_TEMP/demo-${{ matrix.plat }}" \
            --release-base-url "$QTCLIENT_DEMO_RELEASE_URL"

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.plat }}-${{ github.sha }}
          path: ${{ runner.temp }}/client-${{ matrix.plat }}
          retention-days: 30

      - name: Upload demo Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.plat }}-${{ github.sha }}
          path: ${{ runner.temp }}/demo-${{ matrix.plat }}
          retention-days: 30
          if-no-files-found: ignore

      - name: Pack ccache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-${{ matrix.os_slug }}-${{ github.sha }}
          path: ccache-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Push client to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          PLATFORM: ${{ matrix.plat }}
          PACKAGE_OUT: ${{ runner.temp }}/client-${{ matrix.plat }}
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/lifecycle/publish/desktop.sh

  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
      SOURCE_COMMIT: ${{ github.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: lukka/get-cmake@v4.3.4
      - uses: oras-project/setup-oras@v1

      - name: Resolve CIP Qt SHA
        id: cip
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache Qt wasm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-wasm_multithread-${{ steps.cip.outputs.sha }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-client-wasm
          restore-keys: |
            ccache-client-wasm
          save-always: true

      - name: qtclient bootstrap (deps + vcpkg + CIP Qt wasm)
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
          QT_PULL_INTERVAL_SECS: '90'
        # Same as desktop: wait for Qt: build GHCR kits — never compile qtdeclarative here.
        run: bash tools/qt/ci-setup.sh --wasm --pull-only --with-vcpkg --with-deps

      - name: Build stock wasm client
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          STOCK_HOST: '1'
          QTCLIENT_ENABLE_MODS: 'OFF'
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          bash scripts/lifecycle/build/wasm.sh
          ccache -s || true

      - name: Pack client wasm
        env:
          PACKAGE_OUT: ${{ runner.temp }}/client-wasm
          WASM_BUILD: ${{ github.workspace }}/build/tibia-wasm
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: bash scripts/lifecycle/package/wasm.sh

      - name: Upload client-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-wasm-${{ github.sha }}
          path: ${{ runner.temp }}/client-wasm
          retention-days: 30

      - name: Pack ccache
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-wasm-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-wasm-${{ github.sha }}
          path: ccache-wasm-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Push client-wasm to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          PACKAGE_OUT: ${{ runner.temp }}/client-wasm
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/lifecycle/publish/wasm.sh
