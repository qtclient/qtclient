name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      push:
        description: Publish the Docker image to GHCR.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Image Build
    runs-on: ubuntu-latest
    env:
      DOCKER_PUBLISH: ${{ inputs.push && github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Convert repository name to lowercase
        id: repo_lower
        shell: bash
        run: echo "value=${REPO,,}" >> "${GITHUB_OUTPUT}"
        env:
          REPO: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warn when Docker publishing is disabled
        if: inputs.push && env.DOCKER_PUBLISH != 'true'
        shell: bash
        run: echo "::warning::Docker publishing was requested outside a push to main; building without publishing."

      - name: Login to GHCR
        if: env.DOCKER_PUBLISH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: env.DOCKER_PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.value }}:latest
            ghcr.io/${{ steps.repo_lower.outputs.value }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and export
        if: env.DOCKER_PUBLISH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          outputs: type=local,dest=artifacts/docker-rootfs
          tags: |
            ghcr.io/${{ steps.repo_lower.outputs.value }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload docker artifact
        if: env.DOCKER_PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docker-otclient
          path: artifacts/docker-rootfs/opt/tibia/
          retention-days: 7
