name: Reusable Linux Build

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile (${{ matrix.buildtype }})
    strategy:
      fail-fast: false
      matrix:
        buildtype: [linux-debug, linux-release]
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            ccache \
            gcc-14 \
            g++-14 \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libltdl-dev \
            libtool \
            libtool-bin \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            linux-libc-dev \
            make \
            ninja-build \
            perl \
            pkg-config
          sudo ln -sf /usr/bin/ninja /usr/bin/ninja-build
          ninja --version

      - name: Install Qt (client)
        run: |
          set -euo pipefail
          sudo apt-get install -y python3-venv libegl1-mesa-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0
          bash tools/qt/install-qt.sh
          echo "QT_PREFIX=$(bash tools/qt/qt-prefix.sh)" >> "${GITHUB_ENV}"

      - name: CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          max-size: "1G"
          key: ccache-linux-${{ matrix.buildtype }}
          restore-keys: |
            ccache-linux

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.buildtype }}
          buildPreset: ${{ matrix.buildtype }}
          configurePresetAdditionalArgs: "['-DTOGGLE_BIN_FOLDER=ON', '-DOPTIONS_ENABLE_IPO=OFF', '-DCMAKE_PREFIX_PATH=${{ env.QT_PREFIX }}']"

      - name: CIP QML compiles (tibia)
        run: |
          set -euo pipefail
          bin="$(bash deploy/find-client-bin.sh "build/${{ matrix.buildtype }}")"
          test -n "$bin"
          QT_QPA_PLATFORM=offscreen "$bin" --check-qml

      # Needs data/things/<ver>/ from make extract (not in git). Skips cleanly when absent;
      # drop QTCLIENT_SKIP_IF_NO_THINGS once CI caches a things pack so the gate is hard.
      - name: Session-dump screenshot smoke
        env:
          QTCLIENT_SKIP_IF_NO_THINGS: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          bin="$(bash deploy/find-client-bin.sh "build/${{ matrix.buildtype }}")"
          test -n "$bin"
          export QTCLIENT_CLIENT_BIN="$bin"
          bash scripts/ci/check-session-dump-smoke.sh

      - name: Run CTest
        if: matrix.buildtype == 'linux-debug'
        run: ctest --test-dir build/${{ matrix.buildtype }} --output-on-failure --parallel 2

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.buildtype }}
          path: build/${{ matrix.buildtype }}/bin/
