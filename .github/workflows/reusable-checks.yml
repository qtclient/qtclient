name: 'CI: reusable-checks'

on:
  workflow_call:

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1.5.0

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck libxml2-utils yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .github

      - name: Pack SDK / tip contracts (light)
        run: |
          set -euo pipefail
          # Host never builds packs: packs build against the SDK (sdk/, QtClientSdk) and
          # the tip takes installed packs (QTCLIENT_PACKS). Prefer grep (rg often absent).
          test ! -f cmake/host_exports.json
          test ! -f scripts/lifecycle/lib/write_host_exports_rsp.py
          test ! -f cmake/GenerateLinkedMods.cmake
          test ! -f scripts/lifecycle/package/archive-mod.sh
          test -f sdk/CMakeLists.txt
          test -f sdk/QtClientSdkConfig.cmake.in
          test -f cmake/GenerateStaticAbiMods.cmake
          grep -q 'QTCLIENT_PACKS' cmake/TibiaMods.cmake
          grep -q 'QTCLIENT_STATIC_ABI_MOD_IDS' cmake/TibiaMods.cmake
          grep -q 'qtclient_add_mod' cmake/QtClientMod.cmake
          grep -q 'qtclient_mod_install' cmake/QtClientMod.cmake
          grep -q 'add_library(.*MODULE' cmake/QtClientMod.cmake
          grep -q 'add_library(.*STATIC' cmake/QtClientMod.cmake
          if grep -q 'target_sources(tibia\|target_link_libraries(tibia' cmake/QtClientMod.cmake; then
            echo "::error::QtClientMod.cmake must not touch the tip target (packs build apart)" >&2
            exit 1
          fi
          grep -q 'qtclient_mod_register' include/qtclient/abi/mod_register.h
          grep -q 'QTCLIENT_MOD_DEFINE_REGISTER' include/qtclient/abi/mod_register.h
          grep -q 'QTCLIENT_MOD_REGISTER_SYMBOL\|qtclient_mod_register' client/tibia/mods/modloader.cpp
          test -f include/qtclient/abi/host_api_v1.h
          test -f include/qtclient/abi/types.h
          if find include/qtclient -name '*.h' ! -path 'include/qtclient/abi/*' | grep -q .; then
            echo "::error::include/qtclient/ holds abi/ only (non-abi façades were removed)" >&2
            exit 1
          fi
          test -f client/mods/portal/mod.json
          bash -n scripts/lifecycle/lib/merge-launcher-brand.sh
          bash -n scripts/lifecycle/build/sdk.sh
          # MAIN_MODULE only via TibiaMods, for Qt-free wasm SIDE_MODULE packs (no export list).
          if grep -q 'SHELL:-sMAIN_MODULE=2' client/tibia/CMakeLists.txt; then
            echo "::error::MAIN_MODULE must not be hard-coded in tibia CMakeLists (use TibiaMods)" >&2
            exit 1
          fi
          grep -q 'MAIN_MODULE=2' cmake/TibiaMods.cmake
          bash -n scripts/lifecycle/lib/check-tip-pack-presence.sh
          bash -n scripts/lifecycle/lib/merge-pack-into-tip.sh

      - name: Run analysis with reviewdog
        if: github.event.pull_request != null && github.event.pull_request.head.repo.full_name == github.repository
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWDOG_REPORTER: github-pr-check
        run: |
          reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=xmllint -fail-level=error -filter-mode=added
          reviewdog -reporter="${REVIEWDOG_REPORTER}" -runners=cppcheck -filter-mode=added || true
