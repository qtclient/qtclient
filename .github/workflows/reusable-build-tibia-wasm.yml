name: Reusable Tibia App Browser Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Compile (wasm)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-venv libegl1-mesa-dev libfontconfig1-dev libxkbcommon-dev \
            gzip brotli git curl zip unzip tar ccache

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-wasm-${{ hashFiles('tools/qt/qt-version.sh') }}

      - name: Cache vcpkg binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-wasm-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/**', 'tools/qt/qt-version.sh') }}
          restore-keys: |
            vcpkg-wasm-${{ hashFiles('vcpkg.json') }}-
            vcpkg-wasm-

      - name: Setup vcpkg
        run: |
          export VCPKG_BINARY_CACHE_DIR="$RUNNER_TEMP/vcpkg-binary-cache"
          # shellcheck disable=SC1091
          source deploy/ci-setup-vcpkg.sh

      - name: Install Qt for WebAssembly + emsdk
        run: bash tools/qt/install-qt.sh --wasm

      - name: Build tibia wasm
        run: bash deploy/build-tibia.sh --wasm

      - name: Size budget notes
        run: |
          NOTES="$(find build/tibia-wasm -name tibia-wasm-size.txt -type f | head -1 || true)"
          if [[ -n "$NOTES" ]]; then
            cat "$NOTES"
          else
            echo "ERROR: tibia-wasm-size.txt missing"
            find build/tibia-wasm -maxdepth 3 -type f | head -40 || true
            exit 1
          fi
          HTML="$(find build/tibia-wasm -name tibia.html \( -type f -o -type l \) | head -1)"
          WASM="$(find build/tibia-wasm -name tibia.wasm \( -type f -o -type l \) | head -1)"
          test -n "$HTML" && test -e "$HTML"
          test -n "$WASM" && test -e "$WASM"
          wasm_bytes=$(wc -c < "$WASM" | tr -d ' ')
          echo "tibia.wasm bytes=$wasm_bytes path=$WASM"
          if [[ "$wasm_bytes" -lt 5000000 ]]; then
            echo "ERROR: tibia.wasm < 5MB — incomplete wasm link"
            exit 1
          fi
          grep -q 'INITIAL_MEMORY' "$NOTES"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tibia-wasm
          path: |
            build/tibia-wasm/client/tibia/tibia.html
            build/tibia-wasm/client/tibia/tibia.js
            build/tibia-wasm/client/tibia/tibia.wasm
            build/tibia-wasm/client/tibia/tibia.js.gz
            build/tibia-wasm/client/tibia/tibia.wasm.gz
            build/tibia-wasm/client/tibia/tibia.data
            build/tibia-wasm/client/tibia/qtloader.js
            build/tibia-wasm/client/tibia/qtlogo.svg
            build/tibia-wasm/tibia-wasm-size.txt
