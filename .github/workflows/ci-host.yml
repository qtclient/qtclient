---
# Stock Soft host builds (MODS=OFF) + publish host / host-sdk artifacts keyed by SHA.
# idleot-client pack CI and idleot/release assemble consume these (no host rebuild).
name: CI host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: ci-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  host-sdk:
    name: host-sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Pack host-sdk
        env:
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: bash deploy/pack-host-sdk.sh "$RUNNER_TEMP/host-sdk"
      - name: Upload host-sdk artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/host-sdk
          retention-days: 30
      - uses: oras-project/setup-oras@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Push host-sdk to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          tar -czf host-sdk.tgz -C host-sdk .
          oras push "${{ env.REGISTRY }}/qtclient-host-sdk:${{ github.sha }}" \
            "host-sdk.tgz:application/vnd.oci.image.layer.v1.tar+gzip"
          oras tag "${{ env.REGISTRY }}/qtclient-host-sdk:${{ github.sha }}" \
            "${{ env.REGISTRY }}/qtclient-host-sdk:sha-${{ github.sha }}" || true

  host-desktop:
    name: host-${{ matrix.plat }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            preset: linux-release
            os_slug: linux
            kit: linux-x64
            triplet: x64-linux-static
          - plat: macos-arm64
            runner: macos-15
            preset: macos-release
            os_slug: macos
            kit: macos-arm64
            triplet: arm64-osx-static
          - plat: windows-x64
            runner: windows-2022
            preset: windows-release
            os_slug: windows
            kit: windows-x64
            triplet: x64-windows-static-md
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: lukka/get-cmake@v4.3.4
      - uses: oras-project/setup-oras@v1

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve CIP Qt SHA
        id: cip
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=tools/qt/qt-version.sh
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Restore CIP Qt prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: cip-qt-${{ matrix.kit }}-${{ steps.cip.outputs.sha }}

      - name: Soft host bootstrap (deps + vcpkg + CIP Qt)
        shell: bash
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
          QT_PULL_ONLY: '1'
          QT_PULL_WAIT_SECS: '7200'
          QT_PULL_INTERVAL_SECS: '90'
        run: bash tools/qt/ci-setup.sh --pull-only --with-vcpkg --with-deps

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-host-${{ matrix.os_slug }}-${{ steps.cip.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-host-${{ matrix.os_slug }}-${{ steps.cip.outputs.sha }}-
            ccache-host-${{ matrix.os_slug }}-
          # Persist compile progress when the job fails or is cancelled.
          save-always: true

      - name: Configure + build stock host
        id: build
        shell: bash
        env:
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          if [[ "$RUNNER_OS" == macOS ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PATH="/c/ProgramData/chocolatey/bin:/c/tools/zstd:$PATH"
          fi
          cmake --preset ${{ matrix.preset }} \
            -DTOGGLE_BIN_FOLDER=ON \
            -DOPTIONS_ENABLE_IPO=OFF \
            -DTIBIA_BUILD_TESTS=OFF \
            -DQTCLIENT_ENABLE_MODS=OFF \
            -DOPTIONS_ENABLE_CCACHE=ON \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build --preset ${{ matrix.preset }} --target tibia
          cmake --build --preset ${{ matrix.preset }} --target launcher || true
          ccache -s || true

      - name: Pack host desktop tip
        shell: bash
        env:
          QT_PREFIX: ${{ env.QT_PREFIX }}
          QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          bin_dir="build/${{ matrix.preset }}/bin"
          [[ -d "$bin_dir" ]] || bin_dir="build/${{ matrix.preset }}"
          bash deploy/pack-host-desktop.sh \
            --platform "${{ matrix.plat }}" \
            --bin "$bin_dir" \
            --out "$RUNNER_TEMP/host-${{ matrix.plat }}"

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.plat }}-${{ github.sha }}
          path: ${{ runner.temp }}/host-${{ matrix.plat }}
          retention-days: 30

      - name: Pack ccache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-${{ matrix.os_slug }}-${{ github.sha }}
          path: ccache-${{ matrix.os_slug }}-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Push host to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          tar -czf host.tgz -C "host-${{ matrix.plat }}" .
          oras push "${{ env.REGISTRY }}/qtclient-host-${{ matrix.plat }}:${{ github.sha }}" \
            "host.tgz:application/vnd.oci.image.layer.v1.tar+gzip"
          oras tag "${{ env.REGISTRY }}/qtclient-host-${{ matrix.plat }}:${{ github.sha }}" \
            "${{ env.REGISTRY }}/qtclient-host-${{ matrix.plat }}:sha-${{ github.sha }}" || true

  host-wasm:
    name: host-wasm
    runs-on: ubuntu-24.04
    env:
      QTCLIENT_HOST_BUILD_ID: ${{ github.sha }}
      SOURCE_COMMIT: ${{ github.sha }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: lukka/get-cmake@v4.3.4
      - uses: oras-project/setup-oras@v1

      - name: Resolve CIP Qt SHA
        id: cip
        run: |
          set -euo pipefail
          source tools/qt/qt-version.sh
          SHA="$(qt_resolve_cip_sha)"
          [[ -n "$SHA" ]] || { echo "no qt5-cip SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache Qt wasm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: cip-qt-wasm_multithread-${{ steps.cip.outputs.sha }}

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-host-wasm-${{ steps.cip.outputs.sha }}-${{ github.sha }}
          restore-keys: |
            ccache-host-wasm-${{ steps.cip.outputs.sha }}-
            ccache-host-wasm-
          save-always: true

      - name: Soft host bootstrap (deps + vcpkg + CIP Qt wasm)
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QT_CIP_SHA: ${{ steps.cip.outputs.sha }}
        run: bash tools/qt/ci-setup.sh --wasm --with-vcpkg --with-deps

      - name: Build stock wasm host
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          STOCK_HOST: '1'
          QTCLIENT_ENABLE_MODS: 'OFF'
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z || true
          bash deploy/build-tibia.sh --wasm
          ccache -s || true

      - name: Pack host wasm
        run: bash deploy/pack-host-wasm.sh build/tibia-wasm "$RUNNER_TEMP/host-wasm"

      - name: Upload host-wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: host-wasm-${{ github.sha }}
          path: ${{ runner.temp }}/host-wasm
          retention-days: 30

      - name: Pack ccache
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          tar -C "$CCACHE_DIR" -cf - . | zstd -T0 -3 -o "ccache-wasm-${{ github.sha }}.tar.zst"

      - name: Upload ccache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-wasm-${{ github.sha }}
          path: ccache-wasm-${{ github.sha }}.tar.zst
          retention-days: 14
          if-no-files-found: ignore

      - name: Push host-wasm to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          tar -czf host-wasm.tgz -C host-wasm .
          oras push "${{ env.REGISTRY }}/qtclient-host-wasm:${{ github.sha }}" \
            "host-wasm.tgz:application/vnd.oci.image.layer.v1.tar+gzip"
          oras tag "${{ env.REGISTRY }}/qtclient-host-wasm:${{ github.sha }}" \
            "${{ env.REGISTRY }}/qtclient-host-wasm:sha-${{ github.sha }}" || true
