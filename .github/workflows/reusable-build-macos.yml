name: Reusable macOS Build

on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  build:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    name: ${{ matrix.os }}-${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}

    concurrency:
      group: otclient-${{ github.workflow }}-${{ github.ref }}-${{ matrix.buildtype }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        buildtype: [macos-release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.3.4

      - uses: oras-project/setup-oras@v1

      - name: Resolve CIP Qt SHA
        id: cip
        run: |
          set -euo pipefail
          git submodule update --init third_party/Qt5LegacyControls
          # Prefer recorded gitlink without cloning 2.7GB when GHCR/cache hits.
          SHA="$(git rev-parse HEAD:third_party/qt5-cip 2>/dev/null || true)"
          if [[ -z "$SHA" ]]; then
            git submodule update --init --depth 1 third_party/qt5-cip
            SHA="$(git -C third_party/qt5-cip rev-parse HEAD)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Restore CIP Qt prefix
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Qt
          key: cip-qt-macos-arm64-${{ steps.cip.outputs.sha }}

      - name: Install Qt (CIP)
        env:
          QT_ROOT: ${{ runner.temp }}/Qt
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Build from source only if cache/GHCR miss (install-qt.sh inits qt5-cip).
          bash tools/qt/ci-setup-qt.sh
          echo "QT_PREFIX=$(bash tools/qt/qt-prefix.sh)" >> "$GITHUB_ENV"

      - name: Configure and build tibia
        run: |
          set -euo pipefail
          cmake --preset ${{ matrix.buildtype }} \
            -DTOGGLE_BIN_FOLDER=ON \
            -DOPTIONS_ENABLE_IPO=OFF \
            -DTIBIA_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build --preset ${{ matrix.buildtype }} --target tibia

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tibia-${{ matrix.os }}-${{ matrix.buildtype }}-${{ github.sha }}
          path: build/${{ matrix.buildtype }}/bin/
          if-no-files-found: error
